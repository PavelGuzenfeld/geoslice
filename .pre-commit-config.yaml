repos:
  # Diff-scoped mutation gate (issue #1). Python only; the C++ half is declared
  # out in .mutation-gate.toml, which says why. Needs Docker.
  - repo: local
    hooks:
      - id: mutation-gate
        name: mutation gate (diff-scoped)
        entry: mutation-gate --staged
        language: system
        files: ^(python/geoslice/.*\.py|tests/.*\.py)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        files: ^python/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
        files: ^python/
